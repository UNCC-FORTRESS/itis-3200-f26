<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 10 Tool: Firewall Lab</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            background: #37474f;
            color: #eceff1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #263238;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #546e7a;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            opacity: 0.6;
            font-weight: bold;
            margin-right: 5px;
            background: #37474f;
        }

        .tab.active {
            opacity: 1;
            border-bottom: 3px solid #78909c;
            background: #455a64;
        }

        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        .monitor {
            background: #000;
            border: 1px solid #333;
            height: 150px;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .packet {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .server-status {
            text-align: center;
            padding: 10px;
            background: #4caf50;
            color: white;
            border-radius: 4px;
            font-weight: bold;
        }

        .server-status.offline {
            background: #f44336;
        }

        button {
            padding: 10px 20px;
            background: #546e7a;
            color: white;
            border: none;
            cursor: pointer;
        }

        input {
            padding: 8px;
            background: #546e7a;
            border: 1px solid #78909c;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>NetSec Lab Suites</h1>
        <div class="tabs">
            <div class="tab active" onclick="setTab('dos')">Variant A: DoS</div>
            <div class="tab" onclick="setTab('fw')">Variant B: Firewall</div>
            <div class="tab" onclick="setTab('amp')">Variant C: Amplification</div>
        </div>

        <!-- DOS -->
        <div id="dos" class="content active">
            <h3>DoS Attack Sim</h3>
            <div style="display:flex; justify-content:space-between;">
                <div>
                    <label>Target IP:</label> <input type="text" value="10.0.0.1" readonly>
                    <label>Rate:</label> <select id="dosRate" style="padding:8px; background:#546e7a; color:white;">
                        <option value="10">Low</option>
                        <option value="50">Medium</option>
                        <option value="200">High (Flood)</option>
                    </select>
                </div>
                <div id="dosStatus" class="server-status">SERVER ONLINE</div>
            </div>
            <button onclick="toggleDos()" id="dosBtn" style="width:100%; margin-top:10px; background:#f44336;">START
                FLOOD</button>
            <div class="monitor" id="dosMon"></div>
        </div>

        <!-- FIREWALL -->
        <div id="fw" class="content">
            <h3>Firewall Config</h3>
            <p>Define rules to protect the server.</p>
            <div style="background:#37474f; padding:10px;">
                <label>Action:</label> <select id="fwAction">
                    <option value="DROP">DROP</option>
                    <option value="ALLOW">ALLOW</option>
                </select>
                <label>Src IP:</label> <input type="text" id="fwSrc" placeholder="192.168.1.X">
                <button onclick="addRule()">Add Rule</button>
            </div>
            <ul id="fwRules" style="list-style:none; padding:0; background:#000; color:#0f0; padding:10px;">
                <!-- Rules -->
            </ul>
            <div class="monitor" id="fwMon"></div>
            <div id="fwServer" class="server-status">SERVER ONLINE</div>
            <button onclick="startTraffic()">Start Sim Traffic</button>
        </div>

        <!-- AMP -->
        <div id="amp" class="content">
            <h3>DNS Amplification</h3>
            <div style="display:flex; align-items:center; justify-content:space-around; padding:20px;">
                <div style="text-align:center;">
                    <div style="font-size:3em;">😈</div>
                    Attacker
                </div>
                <div style="text-align:center;">
                    <button onclick="sendAmp()">Send Spoofed Packet</button>
                    <div style="font-size:2em;">➡️</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:3em;">🌐</div>
                    Open DNS (Reflector)
                </div>
                <div style="text-align:center;">
                    <div style="font-size:2em;">➡️</div>
                </div>
                <div style="text-align:center;">
                    <div style="font-size:3em;">💻</div>
                    Victim (10.0.0.1)
                </div>
            </div>

            <div id="ampLog"
                style="background:black; color:lime; padding:10px; font-family:monospace; min-height:100px;">
                Stats: Idle.
            </div>
        </div>
    </div>

    <script>
        function setTab(id) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }

        /* --- DOS --- */
        let dosTimer = null;
        let load = 0;

        function toggleDos() {
            const btn = document.getElementById('dosBtn');
            const status = document.getElementById('dosStatus');
            const mon = document.getElementById('dosMon');

            if (dosTimer) {
                clearInterval(dosTimer); dosTimer = null;
                btn.innerText = "START FLOOD";
                load = 0;
                status.innerText = "SERVER ONLINE";
                status.className = "server-status";
                mon.innerHTML = "";
            } else {
                btn.innerText = "STOP FLOOD";
                const rate = parseInt(document.getElementById('dosRate').value);

                dosTimer = setInterval(() => {
                    // Spawn packet
                    const p = document.createElement('div');
                    p.className = 'packet';
                    p.style.background = 'red';
                    p.style.left = '0px';
                    p.style.top = Math.random() * 140 + 'px';
                    mon.appendChild(p);

                    // Animate
                    let pos = 0;
                    const anim = setInterval(() => {
                        pos += 5;
                        p.style.left = pos + 'px';
                        if (pos > 800) {
                            clearInterval(anim);
                            p.remove();
                            // Impact load
                            if (rate > 100) {
                                load += 5;
                                if (load > 100) {
                                    status.innerText = "SERVER OFFLINE (DoS)";
                                    status.className = "server-status offline";
                                }
                            }
                        }
                    }, 20);
                }, 2000 / rate); // Crude rate control
            }
        }

        /* --- FIREWALL --- */
        const rules = [];
        let trafTimer = null;

        function addRule() {
            const act = document.getElementById('fwAction').value;
            const src = document.getElementById('fwSrc').value;
            rules.push({ act, src });

            const li = document.createElement('li');
            li.innerText = `${rules.length}. ${act} FROM ${src}`;
            document.getElementById('fwRules').appendChild(li);
        }

        function startTraffic() {
            if (trafTimer) return;
            const mon = document.getElementById('fwMon');

            trafTimer = setInterval(() => {
                // Generate packet (50% bad, 50% good)
                const isBad = Math.random() > 0.5;
                const src = isBad ? "192.168.1.9" : "10.0.0.5";
                const color = isBad ? "red" : "lime";

                // Add packet
                const p = document.createElement('div');
                p.className = 'packet';
                p.style.background = color;
                p.style.left = '0px';
                p.style.top = Math.random() * 140 + 'px';
                mon.appendChild(p);

                // Animate
                let pos = 0;
                let dropped = false;

                // Check Firewall at 50%

                const anim = setInterval(() => {
                    if (dropped) return;
                    pos += 5;
                    p.style.left = pos + 'px';

                    // Firewall Logic at middle
                    if (pos > 400 && pos < 410) {
                        // Check rules
                        let action = "ALLOW"; // Default
                        for (let r of rules) {
                            if (src.includes(r.src) || r.src === "ANY") {
                                action = r.act;
                                break; // First match
                            }
                        }

                        if (action === "DROP") {
                            p.style.border = "2px solid yellow";
                            p.style.background = "transparent"; // Poof
                            setTimeout(() => p.remove(), 100);
                            dropped = true;
                            clearInterval(anim);
                        }
                    }

                    if (pos > 800) {
                        clearInterval(anim);
                        p.remove();
                    }
                }, 20);

            }, 500);
        }

        /* --- AMP --- */
        function sendAmp() {
            const log = document.getElementById('ampLog');
            log.innerHTML = `
            > Attacker sends DNS Query (60 bytes) spoofed as Victim.<br>
            > DNS Server receives query.<br>
            > DNS Server looks up records.<br>
            > DNS Server sends RESPONSE (3000 bytes) to Victim.<br>
            > <span style="color:red; font-size:1.5em;">IMPACT: 50x Amplification!</span>
            `;
        }
    </script>
</body>

</html>
