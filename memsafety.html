<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Memory Safety Lab — ITIS 6200/8200</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #0A0A0D;
  --surface:  #131318;
  --raised:   #1C1C22;
  --border:   #2A2A32;
  --border-l: #3A3A44;
  --text:     #E4E4E7;
  --dim:      #71717A;
  --muted:    #52525B;
  --accent:   #E8A838;
  --accent-d: #B8842A;
  --cyan:     #22D3EE;
  --rose:     #F43F5E;
  --orange:   #FB923C;
  --emerald:  #34D399;
  --gray:     #6B7280;
  --violet:   #A78BFA;
  --font-display: 'Chakra Petch', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-body: 'DM Sans', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden}
/* dot grid background */
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#ffffff06 1px,transparent 1px);background-size:24px 24px;pointer-events:none;z-index:0}
#root{position:relative;z-index:1;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border-l);border-radius:3px}
button{font-family:var(--font-body);cursor:pointer;border:none;outline:none;transition:all .15s}
button:active{transform:scale(0.97)}
input[type=range]{-webkit-appearance:none;background:var(--border);height:4px;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
code{font-family:var(--font-mono);font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent)33}50%{box-shadow:0 0 12px 2px var(--accent)33}}
.fade-in{animation:fadeIn .3s ease both}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useMemo,useEffect,useCallback}=React;

// ── helpers ────────────────────────────────────────────────
const hex=(v,p=8)=>"0x"+(v>>>0).toString(16).padStart(p,"0");
const hexByte=(v)=>"\\x"+(v&0xff).toString(16).padStart(2,"0");
const range=(n)=>Array.from({length:n},(_,i)=>i);
const align4=(n)=>Math.ceil(n/4)*4;

// ── colors ─────────────────────────────────────────────────
const C={
  bg:'var(--bg)',srf:'var(--surface)',raised:'var(--raised)',
  bdr:'var(--border)',bdrl:'var(--border-l)',
  txt:'var(--text)',dim:'var(--dim)',muted:'var(--muted)',
  acc:'var(--accent)',accd:'var(--accent-d)',
  cyan:'var(--cyan)',rose:'var(--rose)',orange:'var(--orange)',
  emerald:'var(--emerald)',gray:'var(--gray)',violet:'var(--violet)',
};

// ── shared components ──────────────────────────────────────
function Panel({children,style,...p}){
  return <div style={{background:C.srf,border:`1px solid ${C.bdr}`,borderRadius:6,padding:14,...style}} {...p}>{children}</div>;
}
function Label({children,color,style}){
  return <div style={{fontFamily:'var(--font-display)',fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em',color:color||C.dim,marginBottom:8,...style}}>{children}</div>;
}
function Btn({children,active,color,onClick,small,style}){
  const bg=active?(color||C.acc):'transparent';
  const fg=active?'#fff':(C.dim);
  const bd=active?(color||C.acc):C.bdr;
  return <button onClick={onClick} style={{
    padding:small?'4px 10px':'7px 14px',fontSize:small?11:12,fontWeight:active?600:500,
    background:bg,color:fg,border:`1px solid ${bd}`,borderRadius:4,
    fontFamily:'var(--font-body)',...style
  }}>{children}</button>;
}
function Slider({label,value,min,max,onChange,color}){
  return <div style={{display:'flex',alignItems:'center',gap:8}}>
    <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:C.dim,minWidth:70}}>{label}</span>
    <input type="range" min={min} max={max} value={value} onChange={e=>onChange(+e.target.value)} style={{flex:1,accentColor:color||C.acc}}/>
    <span style={{fontFamily:'var(--font-mono)',fontSize:13,color:color||C.acc,fontWeight:700,minWidth:36,textAlign:'right'}}>{value}</span>
  </div>;
}

// ── Tab nav ────────────────────────────────────────────────
function TabNav({tabs,active,onChange}){
  return <div style={{display:'flex',gap:2,background:C.srf,borderRadius:6,padding:3,border:`1px solid ${C.bdr}`}}>
    {tabs.map((t,i)=><button key={i} onClick={()=>onChange(i)} style={{
      padding:'8px 18px',fontSize:12,fontFamily:'var(--font-display)',fontWeight:active===i?600:400,
      letterSpacing:'0.02em',background:active===i?C.raised:'transparent',
      color:active===i?C.acc:C.dim,border:'none',borderRadius:4,
      borderBottom:active===i?`2px solid ${C.acc}`:'2px solid transparent',
    }}>{t}</button>)}
  </div>;
}

// ════════════════════════════════════════════════════════════
//  STACK EXPLOIT TAB — THE HERO
// ════════════════════════════════════════════════════════════
function StackExploitTab(){
  const[bufSize,setBufSize]=useState(20);
  const[shellSize,setShellSize]=useState(12);
  const[padChar,setPadChar]=useState('A');
  const[placement,setPlacement]=useState('start'); // start|end|above
  const[mode,setMode]=useState('exploit'); // benign|exploit
  const[step,setStep]=useState(0);
  const maxStep=5;
  const baseAddr=0xbfffcd40;
  const aBuf=align4(bufSize);
  const sfpAddr=baseAddr+aBuf;
  const ripAddr=sfpAddr+4;

  const shellAddr=placement==='start'?baseAddr:
    placement==='end'?baseAddr+aBuf-align4(shellSize):
    ripAddr+4;

  // ── build stack rows ────────────────────────────────────
  const stackRows=useMemo(()=>{
    const rows=[];
    const isBenign=mode==='benign';
    const aShell=align4(shellSize);

    // above-RIP shellcode
    if(placement==='above'&&!isBenign){
      const nSR=Math.ceil(shellSize/4);
      for(let i=nSR-1;i>=0;i--){
        rows.push({addr:ripAddr+4+i*4,kind:'shell',label:'SHELLCODE',
          bytes:range(4).map(j=>i*4+j<shellSize?'SC':'00'),
          active:step>=2});
      }
    }

    // RIP
    const ripOverwritten=step>=2&&!isBenign;
    rows.push({addr:ripAddr,kind:'rip',
      label:ripOverwritten?`RIP → ${hex(shellAddr)}`:'Return Address (RIP)',
      bytes:ripOverwritten?hex(shellAddr).slice(2).match(/.{2}/g).reverse().map(b=>''+b):['RIP','RIP','RIP','RIP'],
      active:ripOverwritten,
      ptr:step>=5?'EIP':null,ptrColor:C.emerald});

    // SFP
    const sfpOver=step>=1&&!isBenign;
    rows.push({addr:sfpAddr,kind:'sfp',
      label:sfpOver?`SFP → 0x${(padChar||'A').repeat(4).split('').map(c=>c.charCodeAt(0).toString(16)).join('')}`:'Saved Frame Ptr (SFP)',
      bytes:sfpOver?[padChar||'A',padChar||'A',padChar||'A',padChar||'A']:['SFP','SFP','SFP','SFP'],
      active:sfpOver,
      ptr:step===4?'EBP→ESP':null,ptrColor:C.orange});

    // buffer rows
    const bufRows=aBuf/4;
    for(let i=bufRows-1;i>=0;i--){
      const addr=baseAddr+i*4;
      let kind='buf',label=`buf[${i*4}..${i*4+3}]`,bytes=['','','',''],active=false;

      if(isBenign&&step>=1){
        // benign: just fills with printable chars
        const ch=String.fromCharCode(65+(i%26));
        bytes=[ch,ch,ch,ch]; kind='buf'; label=`"${ch.repeat(4)}"`;
      } else if(!isBenign&&step>=1){
        if(placement==='start'){
          if(i*4<shellSize){
            bytes=range(4).map(j=>i*4+j<shellSize?'SC':padChar);
            kind='shell'; label=i*4+4<=shellSize?'SHELLCODE':'SHELL+PAD';
            active=step>=3;
          }else{
            bytes=[padChar,padChar,padChar,padChar]; kind='garbage'; label='padding';
          }
        }else if(placement==='end'){
          const shellStart=aBuf-aShell;
          if(i*4>=shellStart){
            const si=i*4-shellStart;
            bytes=range(4).map(j=>si+j<shellSize?'SC':'00');
            kind='shell'; label='SHELLCODE'; active=step>=3;
          }else{
            bytes=[padChar,padChar,padChar,padChar]; kind='garbage'; label='padding';
          }
        }else{
          bytes=[padChar,padChar,padChar,padChar]; kind='garbage'; label='padding';
        }
      }

      rows.push({addr,kind,label,bytes,active,
        ptr:i===0&&step===0?'ESP':null,ptrColor:C.emerald});
    }

    rows.push({addr:baseAddr-4,kind:'pad',label:'',bytes:['···','···','···','···']});
    return rows;
  },[bufSize,shellSize,padChar,placement,mode,step]);

  // ── kind→color mapping ──────────────────────────────────
  const kindColor=(k)=>({
    shell:C.cyan, rip:C.rose, sfp:C.orange, buf:C.emerald,
    garbage:C.gray, pad:C.muted
  }[k]||C.dim);

  // ── payload string ──────────────────────────────────────
  const payloadStr=useMemo(()=>{
    if(mode==='benign') return `"${'A'.repeat(Math.min(bufSize,bufSize))}" (${bufSize} chars, fits in buffer)`;
    const aShell=align4(shellSize);
    if(placement==='start'){
      const pad=aBuf-shellSize+4;
      return `SHELLCODE[${shellSize}] + '${padChar}'×${pad} + ${hex(shellAddr)}`;
    }
    if(placement==='end'){
      const padBefore=aBuf-aShell;
      return `'${padChar}'×${padBefore} + SHELLCODE[${shellSize}] + '${padChar}'×4 + ${hex(shellAddr)}`;
    }
    return `'${padChar}'×${aBuf+4} + ${hex(shellAddr)} + SHELLCODE[${shellSize}]`;
  },[mode,placement,shellSize,bufSize,padChar,shellAddr,aBuf]);

  // ── step descriptions ───────────────────────────────────
  const stepDesc=[
    mode==='benign'
      ?"Buffer is empty. gets() will start writing at buf[0]. A normal user types a short string that fits."
      :"Buffer is empty. gets() will start writing at buf[0]. The attacker has crafted a payload longer than the buffer.",
    mode==='benign'
      ?"User input fills the buffer with normal characters. It stays within bounds — no overflow."
      :`gets() writes the payload into memory: shellcode bytes + '${padChar}' padding overflows past buf[] into the SFP.`,
    mode==='benign'
      ?"Function runs normally. The RIP is untouched — it still points to the caller's next instruction."
      :`gets() continues past the SFP and overwrites the RIP with ${hex(shellAddr)} — the address of our shellcode.`,
    mode==='benign'
      ?"Function epilogue: ESP restored, EBP popped. Everything is normal."
      :"Epilogue begins: movl %ebp,%esp (ESP→EBP), popl %ebp (SFP→EBP). The corrupted SFP goes into EBP — we don't care about EBP though.",
    mode==='benign'
      ?"ret pops RIP into EIP. Execution returns to the caller. Program continues normally."
      :"ret pops the overwritten RIP into EIP. ESP moves past it.",
    mode==='benign'
      ?"Program finishes normally. No exploit occurred."
      :`EIP now points to ${hex(shellAddr)} — our shellcode. The processor executes attacker-controlled instructions.`,
  ];

  return <div style={{display:'flex',gap:14,flexWrap:'wrap',animation:'fadeIn .4s ease'}}>
    {/* ── LEFT COLUMN: code + controls ── */}
    <div style={{flex:'1 1 300px',minWidth:280,display:'flex',flexDirection:'column',gap:10}}>

      {/* Mode toggle */}
      <Panel>
        <Label>Input Mode</Label>
        <div style={{display:'flex',gap:4}}>
          <Btn active={mode==='benign'} color={C.emerald} onClick={()=>{setMode('benign');setStep(0)}}>Normal Input</Btn>
          <Btn active={mode==='exploit'} color={C.rose} onClick={()=>{setMode('exploit');setStep(0)}}>Exploit Payload</Btn>
        </div>
      </Panel>

      {/* C code */}
      <Panel>
        <Label>Vulnerable Program</Label>
        <pre style={{fontFamily:'var(--font-mono)',fontSize:12,lineHeight:1.8,color:C.txt}}>
{`void `}<span style={{color:C.acc}}>vulnerable</span>{`(void) {\n`}
{`  char buf[`}<span style={{color:C.cyan}}>{bufSize}</span>{`];\n`}
{`  `}<span style={{color:C.rose}}>gets</span>{`(buf);`}<span style={{color:C.muted}}> // no bounds check</span>{`\n`}
{`}\n`}
{`int main(void) {\n  vulnerable();\n  return 0;\n}`}
        </pre>
      </Panel>

      {/* Payload config */}
      {mode==='exploit'&&<Panel style={{borderColor:'var(--rose)33'}}>
        <Label color={C.rose}>Payload Builder</Label>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <Slider label="Buffer" value={bufSize} min={8} max={64} onChange={v=>{setBufSize(v);setStep(0)}} color={C.emerald}/>
          <Slider label="Shellcode" value={shellSize} min={4} max={80} onChange={v=>{setShellSize(v);setStep(0)}} color={C.cyan}/>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:C.dim,minWidth:70}}>Pad char</span>
            <input value={padChar} onChange={e=>{const v=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');setPadChar(v.slice(-1))}}
              onBlur={e=>{if(!padChar)setPadChar('A')}}
              style={{width:36,padding:'4px 8px',background:C.raised,border:`1px solid ${C.bdr}`,borderRadius:4,
                color:C.acc,fontFamily:'var(--font-mono)',fontSize:14,textAlign:'center',outline:'none'}}/>
          </div>
          <Label style={{marginTop:4,marginBottom:2}}>Shellcode Placement</Label>
          <div style={{display:'flex',gap:4}}>
            {[['start','At buf start'],['end','At buf end'],['above','Above RIP']].map(([v,l])=>
              <Btn key={v} small active={placement===v} color={C.cyan} onClick={()=>{setPlacement(v);setStep(0)}}>{l}</Btn>
            )}
          </div>
        </div>
      </Panel>}

      {mode==='benign'&&<Panel style={{borderColor:'var(--emerald)33'}}>
        <Label color={C.emerald}>Normal Input</Label>
        <Slider label="Buffer" value={bufSize} min={8} max={64} onChange={v=>{setBufSize(v);setStep(0)}} color={C.emerald}/>
        <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:C.emerald,marginTop:8,padding:'8px 10px',
          background:'#34D39910',borderRadius:4,border:'1px solid #34D39920'}}>
          User types a {Math.min(bufSize-1,15)}-char string that fits within buf[{bufSize}]
        </div>
      </Panel>}

      {/* Assembly */}
      <Panel>
        <Label>Assembly — Epilogue</Label>
        <pre style={{fontFamily:'var(--font-mono)',fontSize:11,lineHeight:2}}>
          {[
            {c:'call gets',s:[0,1]},
            {c:'addl $4, %esp',s:[3]},
            {c:'movl %ebp, %esp',s:[4]},
            {c:'popl %ebp',s:[4]},
            {c:'ret',s:[5]},
          ].map((l,i)=>{
            const on=l.s.includes(step);
            return <div key={i} style={{color:on?C.acc:C.muted,fontWeight:on?700:400,
              borderLeft:on?`2px solid ${C.acc}`:'2px solid transparent',paddingLeft:6}}>
              {on?'> ':'. '}{l.c}
            </div>;
          })}
        </pre>
      </Panel>
    </div>

    {/* ── CENTER: THE STACK ── */}
    <div style={{flex:'1 1 380px',minWidth:340}}>
      <Panel style={{padding:'16px 16px 16px 60px',position:'relative',minHeight:400}}>
        <div style={{position:'absolute',top:14,left:14,right:14,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <Label style={{marginBottom:0}}>Stack Memory</Label>
          <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:C.muted}}>
            HIGH ↑ · LOW ↓
          </span>
        </div>
        <div style={{marginTop:24,display:'flex',flexDirection:'column',gap:1}}>
          {/* higher mem */}
          <div style={{display:'flex',alignItems:'center',gap:0,height:28}}>
            <div style={{width:0}}/>
            <div style={{width:74,textAlign:'right',paddingRight:6,fontFamily:'var(--font-mono)',fontSize:10,color:C.muted}}>···</div>
            <div style={{display:'flex',gap:1}}>
              {range(4).map(i=><div key={i} style={{width:44,height:26,background:C.raised,borderRadius:i===0?'3px 0 0 3px':i===3?'0 3px 3px 0':'0',
                display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-mono)',fontSize:10,color:C.muted}}>···</div>)}
            </div>
            <div style={{marginLeft:8,fontFamily:'var(--font-mono)',fontSize:10,color:C.muted}}>higher memory</div>
          </div>

          {stackRows.map((row,idx)=>{
            const col=kindColor(row.kind);
            const isActive=row.active;
            return <div key={idx} style={{display:'flex',alignItems:'center',position:'relative',height:30}}>
              {/* pointer label */}
              <div style={{position:'absolute',left:-56,width:52,textAlign:'right'}}>
                {row.ptr&&<span style={{fontFamily:'var(--font-mono)',fontSize:10,color:row.ptrColor,fontWeight:700}}>
                  {row.ptr} →
                </span>}
              </div>
              {/* address */}
              <div style={{width:74,textAlign:'right',paddingRight:6,fontFamily:'var(--font-mono)',fontSize:10,color:C.muted,flexShrink:0}}>
                {row.addr!=null?hex(row.addr):''}
              </div>
              {/* 4 byte cells */}
              <div style={{display:'flex',gap:1}}>
                {row.bytes.map((b,i)=><div key={i} style={{
                  width:44,height:28,display:'flex',alignItems:'center',justifyContent:'center',
                  fontFamily:'var(--font-mono)',fontSize:10,fontWeight:600,
                  color:row.kind==='pad'?C.muted:'#fff',
                  background:row.kind==='pad'?C.raised:`${col}20`,
                  border:`1px solid ${row.kind==='pad'?C.bdr:col}`,
                  borderRadius:i===0?'3px 0 0 3px':i===3?'0 3px 3px 0':'0',
                  boxShadow:isActive?`0 0 8px ${col}30`:'none',
                  transition:'all .2s',
                }}>{b}</div>)}
              </div>
              {/* label */}
              <div style={{marginLeft:8,fontFamily:'var(--font-body)',fontSize:11,color:col,fontWeight:500,
                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:180}}>
                {row.label}
              </div>
            </div>;
          })}
        </div>

        {/* Legend */}
        <div style={{marginTop:14,marginLeft:-46,display:'flex',flexWrap:'wrap',gap:10}}>
          {[[C.cyan,'Shellcode'],[C.rose,'RIP'],[C.orange,'SFP'],[C.gray,'Padding'],[C.emerald,'Buffer']].map(([c,l])=>
            <div key={l} style={{display:'flex',alignItems:'center',gap:4}}>
              <div style={{width:8,height:8,borderRadius:2,background:c}}/>
              <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:C.dim}}>{l}</span>
            </div>
          )}
        </div>

        {/* Registers */}
        <div style={{marginTop:10,marginLeft:-46,padding:'8px 10px',background:C.raised,borderRadius:4}}>
          <div style={{fontFamily:'var(--font-mono)',fontSize:11,display:'flex',flexWrap:'wrap',gap:'2px 16px'}}>
            <span><span style={{color:C.emerald,fontWeight:700}}>EIP</span> {step>=5&&mode==='exploit'?hex(shellAddr):step>=4?'ret':'in vulnerable()'}</span>
            <span><span style={{color:C.orange,fontWeight:700}}>EBP</span> {step>=4&&mode==='exploit'?`0x${(padChar||'A').charCodeAt(0).toString(16).repeat(4).slice(0,8)}`:hex(sfpAddr)}</span>
            <span><span style={{color:C.acc,fontWeight:700}}>ESP</span> {step>=5?hex(ripAddr+4):step>=4?hex(ripAddr):hex(baseAddr)}</span>
            {mode==='exploit'&&step>=5&&<span style={{color:C.rose,fontWeight:700}}>EXPLOITED</span>}
          </div>
        </div>
      </Panel>
    </div>

    {/* ── RIGHT COLUMN: steps + payload ── */}
    <div style={{flex:'1 1 280px',minWidth:240,display:'flex',flexDirection:'column',gap:10}}>

      {/* Step controls */}
      <Panel>
        <Label>Execution Step</Label>
        <div style={{display:'flex',gap:4,marginBottom:10}}>
          <Btn onClick={()=>setStep(Math.max(0,step-1))} style={{background:step===0?C.raised:C.acc,color:'#fff',flex:1,opacity:step===0?.4:1}}>Prev</Btn>
          <Btn onClick={()=>setStep(Math.min(maxStep,step+1))} style={{background:step===maxStep?C.raised:C.emerald,color:'#fff',flex:1,opacity:step===maxStep?.4:1}}>Next</Btn>
          <Btn onClick={()=>setStep(0)} style={{background:C.raised,color:C.dim}}>Reset</Btn>
        </div>
        {/* dots */}
        <div style={{display:'flex',gap:4,marginBottom:10,justifyContent:'center'}}>
          {range(maxStep+1).map(i=><div key={i} onClick={()=>setStep(i)} style={{
            width:8,height:8,borderRadius:'50%',cursor:'pointer',transition:'all .2s',
            background:i<=step?(mode==='exploit'?C.rose:C.emerald):C.bdr,
            boxShadow:i===step?`0 0 6px ${mode==='exploit'?C.rose:C.emerald}`:''
          }}/>)}
        </div>
        <div style={{padding:'10px 12px',background:C.raised,borderRadius:4,
          borderLeft:`3px solid ${mode==='exploit'?C.rose:C.emerald}`}}>
          <div style={{fontFamily:'var(--font-display)',fontSize:12,color:mode==='exploit'?C.rose:C.emerald,fontWeight:600,marginBottom:3}}>
            Step {step}
          </div>
          <div style={{fontFamily:'var(--font-body)',fontSize:12,color:C.txt,lineHeight:1.55}}>
            {stepDesc[step]}
          </div>
        </div>
      </Panel>

      {/* Payload visualization */}
      <Panel>
        <Label>Payload Bytes</Label>
        <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:mode==='exploit'?C.rose:C.emerald,
          wordBreak:'break-all',lineHeight:1.7,padding:'8px 10px',background:C.raised,borderRadius:4}}>
          {payloadStr}
        </div>
      </Panel>

      {/* Key insight */}
      <Panel style={{borderColor:mode==='exploit'?'#F43F5E25':'#34D39925'}}>
        <Label color={mode==='exploit'?C.rose:C.emerald}>
          {mode==='exploit'?'Why This Works':'Why This Is Safe'}
        </Label>
        <div style={{fontFamily:'var(--font-body)',fontSize:12,color:C.txt,lineHeight:1.6}}>
          {mode==='exploit'
            ?<>gets() has <strong style={{color:C.rose}}>no length parameter</strong> — it writes until newline regardless of buffer size. The attacker writes {aBuf+4} bytes of filler to reach the RIP, then overwrites it with the shellcode address.</>
            :<>A normal user's input is shorter than buf[{bufSize}]. gets() stops at the newline. The RIP remains untouched, and the function returns normally to the caller.</>
          }
        </div>
        {mode==='exploit'&&<div style={{marginTop:8,fontFamily:'var(--font-mono)',fontSize:11,color:C.emerald,
          padding:'6px 8px',background:'#34D39910',borderRadius:4}}>
          Fix: fgets(buf, sizeof(buf), stdin);
        </div>}
      </Panel>
    </div>
  </div>;
}

// ════════════════════════════════════════════════════════════
//  FORMAT STRINGS TAB
// ════════════════════════════════════════════════════════════
function FormatStringsTab(){
  const[fmtInput,setFmtInput]=useState('%d%s');
  const secretNumber=42;
  const secretString="pancake";

  const specifiers=[];
  const re=/%([dxsn])/g;let m;
  while((m=re.exec(fmtInput))!==null)specifiers.push(m[1]);

  const outputs=[];let bw=0;
  specifiers.forEach((s,i)=>{
    if(i===0){
      if(s==='d'){outputs.push({v:''+secretNumber,ok:true});bw+=(''+secretNumber).length}
      else if(s==='x'){const h='0x'+secretNumber.toString(16);outputs.push({v:h,ok:true});bw+=h.length}
      else if(s==='s'){outputs.push({v:'dereferences 42 as pointer — crash',ok:false})}
      else if(s==='n'){outputs.push({v:`writes ${bw} to address 42 — crash`,ok:false})}
    }else if(i===1){
      if(s==='d')outputs.push({v:'prints ptr as int',ok:true});
      else if(s==='x')outputs.push({v:'0xbfff1234',ok:true});
      else if(s==='s'){outputs.push({v:secretString,ok:true});bw+=secretString.length}
      else if(s==='n')outputs.push({v:`writes ${bw} to 0xbfff1234`,ok:false});
    }else outputs.push({v:`reads stack slot ${i+1}`,ok:true});
  });

  const stackRows=[
    {label:'RIP of vulnerable',color:C.muted,tag:null},
    {label:'SFP of vulnerable',color:C.muted,tag:null},
    {label:`secret_string → "${secretString}"`,color:C.violet,tag:'arg2'},
    {label:`secret_number = ${secretNumber}`,color:C.orange,tag:'arg1'},
    {label:'&buf (arg to printf)',color:C.acc,tag:'arg0'},
    {label:'RIP of printf',color:C.muted,tag:null},
    {label:'SFP of printf',color:C.muted,tag:null},
    {label:'[printf frame]',color:C.muted,tag:null},
  ];

  return <div style={{display:'flex',gap:14,flexWrap:'wrap',animation:'fadeIn .4s ease'}}>
    <div style={{flex:'1 1 320px',minWidth:280,display:'flex',flexDirection:'column',gap:10}}>
      <Panel>
        <Label>Attacker-Controlled Format String</Label>
        <input value={fmtInput} onChange={e=>setFmtInput(e.target.value)}
          placeholder="e.g. %d%s or %x%x%x%n"
          style={{width:'100%',padding:'8px 12px',background:C.raised,border:`1px solid ${C.bdr}`,
            borderRadius:4,color:C.acc,fontFamily:'var(--font-mono)',fontSize:14,outline:'none'}}/>
        <div style={{fontFamily:'var(--font-mono)',fontSize:10,color:C.dim,marginTop:6,lineHeight:1.5}}>
          Try: <span style={{color:C.acc}}>%d%s</span> (leak int + string) · <span style={{color:C.acc}}>%d%n</span> (write to memory) · <span style={{color:C.acc}}>%x%x%x</span> (hex dump)
        </div>
      </Panel>
      <Panel>
        <Label>Vulnerable Code</Label>
        <pre style={{fontFamily:'var(--font-mono)',fontSize:12,lineHeight:1.8,color:C.txt}}>
{`char buf[64];\nvoid `}<span style={{color:C.acc}}>vulnerable</span>{`(void) {\n`}
{`  char *secret_string = `}<span style={{color:C.emerald}}>"pancake"</span>{`;\n`}
{`  int secret_number = `}<span style={{color:C.orange}}>42</span>{`;\n`}
{`  fgets(buf, 64, stdin);\n`}
{`  printf(`}<span style={{color:C.rose}}>buf</span>{`); `}<span style={{color:C.muted}}>// DANGEROUS</span>{`\n}`}
        </pre>
      </Panel>
      <Panel>
        <Label color={C.emerald}>Output</Label>
        <div style={{fontFamily:'var(--font-mono)',fontSize:12,padding:'8px 10px',background:C.raised,borderRadius:4,minHeight:28}}>
          {outputs.length===0?<span style={{color:C.muted}}>No format specifiers</span>:
            outputs.map((o,i)=><div key={i}><span style={{color:C.dim}}>%{specifiers[i]}: </span>
              <span style={{color:o.ok?C.emerald:C.rose}}>{o.v}</span></div>)}
        </div>
      </Panel>
      <Panel style={{borderColor:'#F43F5E25'}}>
        <Label color={C.rose}>Why This Is Dangerous</Label>
        <div style={{fontFamily:'var(--font-body)',fontSize:12,color:C.txt,lineHeight:1.6}}>
          printf infers argument count from format specifiers. With no real arguments, it reads values from
          the stack — leaking secrets (%d, %x, %s) or writing to arbitrary memory (%n).
        </div>
        <div style={{marginTop:8,fontFamily:'var(--font-mono)',fontSize:11,color:C.emerald,
          padding:'6px 8px',background:'#34D39910',borderRadius:4}}>
          Fix: printf("%s", buf);
        </div>
      </Panel>
    </div>
    <div style={{flex:'1 1 340px',minWidth:300}}>
      <Panel>
        <Label>Stack During printf(buf)</Label>
        <div style={{display:'flex',flexDirection:'column',gap:2}}>
          {stackRows.map((row,i)=>{
            const glowing=row.tag&&specifiers.length>0&&parseInt((row.tag||'').replace('arg',''))<=specifiers.length;
            return <div key={i} style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:40,textAlign:'right',fontFamily:'var(--font-mono)',fontSize:10,color:row.color,fontWeight:700}}>
                {row.tag?row.tag+'→':''}
              </div>
              <div style={{flex:1,padding:'8px 12px',background:glowing?`${row.color}15`:C.raised,
                border:`1px solid ${glowing?row.color:C.bdr}`,borderRadius:4,
                fontFamily:'var(--font-body)',fontSize:12,color:row.color==='var(--muted)'?C.dim:row.color,fontWeight:500,
                boxShadow:glowing?`0 0 8px ${row.color}20`:'none',transition:'all .2s'}}>
                {row.label}
              </div>
            </div>;
          })}
        </div>
        <div style={{marginTop:12,fontFamily:'var(--font-body)',fontSize:12,color:C.txt,lineHeight:1.6,
          padding:'10px 12px',background:C.raised,borderRadius:4,borderLeft:`3px solid ${C.violet}`}}>
          printf reads arg0 (format string pointer), counts specifiers, then walks
          <strong> up the stack</strong> reading arg1, arg2, etc. as whatever type each specifier dictates —
          even though no real arguments exist there.
        </div>
      </Panel>
    </div>
  </div>;
}

// ════════════════════════════════════════════════════════════
//  INTEGER BUGS TAB
// ════════════════════════════════════════════════════════════
function IntegerBugsTab(){
  const[scenario,setScenario]=useState('signed');
  const[val,setVal]=useState(-1);

  const result=useMemo(()=>{
    if(scenario==='signed'){
      const gt64=val>64;
      const asU=val<0?(val>>>0):val;
      return{gt64,asU,vuln:val<0};
    }else{
      const v=val<0?0xffffffff:Math.min(val,0xffffffff);
      const vp2=(v+2)>>>0;
      const wrap=vp2<v;
      return{v,vp2,wrap,alloc:wrap?vp2:v+2};
    }
  },[val,scenario]);

  return <div style={{maxWidth:780,animation:'fadeIn .4s ease',display:'flex',flexDirection:'column',gap:10}}>
    <div style={{display:'flex',gap:4}}>
      <Btn active={scenario==='signed'} color={C.orange} onClick={()=>{setScenario('signed');setVal(-1)}}>Signed/Unsigned Mismatch</Btn>
      <Btn active={scenario==='overflow'} color={C.orange} onClick={()=>{setScenario('overflow');setVal(0xfffffffe)}}>Integer Overflow</Btn>
    </div>
    <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
      <div style={{flex:'1 1 360px',display:'flex',flexDirection:'column',gap:10}}>
        <Panel>
          <Label color={C.rose}>Vulnerable Code</Label>
          {scenario==='signed'?
            <pre style={{fontFamily:'var(--font-mono)',fontSize:12,lineHeight:1.8,color:C.txt}}>
{`void func(`}<span style={{color:C.rose}}>int</span>{` len, char *data) {\n  char buf[64];\n  if (len > 64) return;\n  memcpy(buf, data, len);\n`}
{`  `}<span style={{color:C.muted}}>// memcpy takes size_t (unsigned)</span>{`\n}`}
            </pre>:
            <pre style={{fontFamily:'var(--font-mono)',fontSize:12,lineHeight:1.8,color:C.txt}}>
{`void func(size_t len, char *data) {\n  char *buf = malloc(`}<span style={{color:C.rose}}>len + 2</span>{`);\n  if (!buf) return;\n  memcpy(buf, data, len);\n  buf[len] = '\\n';\n  buf[len+1] = '\\0';\n}`}
            </pre>
          }
        </Panel>
        <Panel>
          <Label>Test Values</Label>
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            {(scenario==='signed'?[-1,0,32,65,-100]:[10,100,0xfffffffd,0xfffffffe,0xffffffff]).map(v=>
              <Btn key={v} small active={val===v} color={C.orange} onClick={()=>setVal(v)}>
                {v>0xffff?hex(v):v}
              </Btn>
            )}
          </div>
        </Panel>
      </div>
      <div style={{flex:'1 1 340px'}}>
        <Panel style={{borderColor:result.vuln||result.wrap?'#F43F5E44':'#34D39944'}}>
          <Label color={result.vuln||result.wrap?C.rose:C.emerald}>
            {result.vuln||result.wrap?'VULNERABLE':'Safe'}
          </Label>
          <div style={{fontFamily:'var(--font-mono)',fontSize:12,lineHeight:2,color:C.txt}}>
            {scenario==='signed'?<>
              <div>len = <span style={{color:C.orange}}>{val}</span></div>
              <div>len {'>'} 64? → <span style={{color:result.gt64?C.emerald:C.rose}}>{result.gt64?'true → returns':'false → continues'}</span></div>
              {!result.gt64&&<div>memcpy casts to size_t: <span style={{color:result.vuln?C.rose:C.txt}}>{hex(result.asU)}</span></div>}
              {result.vuln&&<div style={{color:C.rose,fontWeight:700}}>Copies {hex(result.asU)} bytes = massive overflow</div>}
            </>:<>
              <div>len = <span style={{color:C.orange}}>{hex(result.v)}</span></div>
              <div>len + 2 = <span style={{color:result.wrap?C.rose:C.txt}}>{hex(result.vp2)}</span>{result.wrap&&<span style={{color:C.rose}}> WRAPPED</span>}</div>
              <div>malloc: <span style={{color:result.wrap?C.rose:C.emerald}}>{result.alloc} bytes</span></div>
              {result.wrap&&<div style={{color:C.rose,fontWeight:700}}>malloc({result.alloc}) then memcpy({hex(result.v)}) = heap overflow</div>}
            </>}
          </div>
        </Panel>
        <Panel style={{marginTop:10,borderColor:'#34D39944'}}>
          <Label color={C.emerald}>Safe Version</Label>
          {scenario==='signed'?
            <pre style={{fontFamily:'var(--font-mono)',fontSize:12,lineHeight:1.8,color:C.txt}}>
{`void safe(`}<span style={{color:C.emerald}}>size_t</span>{` len, ...) {\n  if (len > 64) return;\n  memcpy(buf, data, len);\n}`}
            </pre>:
            <pre style={{fontFamily:'var(--font-mono)',fontSize:12,lineHeight:1.8,color:C.txt}}>
{`void safe(size_t len, ...) {\n  `}<span style={{color:C.emerald}}>if (len > SIZE_MAX - 2) return;</span>{`\n  char *buf = malloc(len + 2);\n  ...\n}`}
            </pre>
          }
        </Panel>
      </div>
    </div>
  </div>;
}

    <div style={{flex:'1 1 440px',minWidth:380}}>
      <Panel style={{padding:'16px 16px 16px 56px',position:'relative'}}>
        <Label style={{marginLeft:-42}}>Stack Memory</Label>
        <div style={{display:'flex',flexDirection:'column',gap:1}}>
          {ph.stk.map((row,i)=>{
            const col=kc(row.k,row.f);
            const freed=row.k==='x';
            const fc=row.f>=0?FC[Math.min(row.f,3)]:'transparent';
            return <div key={i} style={{display:'flex',alignItems:'center',height:30,position:'relative'}}>
              <div style={{position:'absolute',left:-50,width:46,textAlign:'right'}}>
                {i===ph.ei&&<span style={{fontFamily:'var(--font-mono)',fontSize:9,color:C.acc,fontWeight:700}}>ESP→</span>}
                {i===ph.bi&&i!==ph.ei&&<span style={{fontFamily:'var(--font-mono)',fontSize:9,color:C.orange,fontWeight:700}}>EBP→</span>}
              </div>
              <div style={{width:3,alignSelf:'stretch',background:fc,borderRadius:1,marginRight:5,opacity:.5}}/>
              <div style={{width:78,textAlign:'right',paddingRight:6,fontFamily:'var(--font-mono)',fontSize:10,color:C.muted,flexShrink:0}}>{hex(row.a)}</div>
              <div style={{width:88,padding:'4px 6px',fontFamily:'var(--font-mono)',fontSize:10,textAlign:'center',flexShrink:0,
                background:freed?C.srf:`${col}15`,border:`1px solid ${freed?C.bdr:col}`,borderRadius:3,
                color:freed?C.muted:col,fontWeight:600,textDecoration:freed?'line-through':'none',opacity:freed?.45:1}}>
                {row.v}
              </div>
              <div style={{marginLeft:6,fontFamily:'var(--font-body)',fontSize:11,color:freed?C.muted:col,fontWeight:500,
                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{row.l}</div>
              {row.n&&<span style={{fontFamily:'var(--font-mono)',fontSize:9,color:C.muted,marginLeft:4}}>← {row.n}</span>}
            </div>;
          })}
        </div>
        <div style={{marginTop:10,marginLeft:-42,display:'flex',flexWrap:'wrap',gap:10}}>
          {prog.names.map((n,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:4,opacity:activeF.has(i)?1:.3}}>
            <div style={{width:3,height:14,borderRadius:1,background:FC[i]}}/><span style={{fontFamily:'var(--font-mono)',fontSize:10,color:FC[i]}}>{n}()</span>
          </div>)}
          {[[C.rose,'RIP'],[C.orange,'SFP'],[C.violet,'Args']].map(([c,l])=>
            <div key={l} style={{display:'flex',alignItems:'center',gap:4}}>
              <div style={{width:8,height:8,borderRadius:2,background:c}}/><span style={{fontFamily:'var(--font-mono)',fontSize:10,color:C.dim}}>{l}</span>
            </div>
          )}
        </div>
      </Panel>
    </div>
  </div>;
}

// ════════════════════════════════════════════════════════════
//  SAFE FUNCTIONS TAB
// ════════════════════════════════════════════════════════════
function SafeFunctionsTab(){
  const funcs=[
    {u:'gets(buf)',s:'fgets(buf, sizeof(buf), stdin)',w:'No length limit. Reads until newline regardless of buffer size.',sev:'CRIT'},
    {u:'strcpy(dst, src)',s:'strncpy(dst, src, n)',w:'Copies until null terminator with no bounds check.',sev:'CRIT'},
    {u:'sprintf(buf, fmt, ...)',s:'snprintf(buf, sizeof(buf), fmt, ...)',w:'Writes formatted output without bounds checking.',sev:'HIGH'},
    {u:'printf(user_input)',s:'printf("%s", user_input)',w:'User input as format string allows %n writes and stack leaks.',sev:'CRIT'},
    {u:'strlen(s)',s:'strnlen(s, maxlen)',w:'Reads until null — out-of-bounds on unterminated strings.',sev:'MED'},
    {u:'strcat(dst, src)',s:'strncat(dst, src, n)',w:'Appends with no bounds check.',sev:'HIGH'},
  ];
  const sevC={CRIT:C.rose,HIGH:C.orange,MED:C.acc};

  return <div style={{maxWidth:800,animation:'fadeIn .4s ease',display:'flex',flexDirection:'column',gap:6}}>
    {funcs.map((f,i)=><Panel key={i} style={{display:'flex',gap:14,alignItems:'flex-start',flexWrap:'wrap'}}>
      <div style={{flex:'0 0 40px'}}>
        <span style={{padding:'2px 6px',borderRadius:3,fontSize:10,fontFamily:'var(--font-display)',fontWeight:700,
          color:'#fff',background:sevC[f.sev]}}>{f.sev}</span>
      </div>
      <div style={{flex:1,minWidth:200}}>
        <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:4,flexWrap:'wrap'}}>
          <code style={{color:C.rose,background:'#F43F5E12',padding:'2px 6px',borderRadius:3,textDecoration:'line-through'}}>{f.u}</code>
          <span style={{color:C.muted,fontSize:11}}>→</span>
          <code style={{color:C.emerald,background:'#34D39912',padding:'2px 6px',borderRadius:3}}>{f.s}</code>
        </div>
        <div style={{fontFamily:'var(--font-body)',fontSize:11,color:C.dim,lineHeight:1.5}}>{f.w}</div>
      </div>
    </Panel>)}
  </div>;
}

// ════════════════════════════════════════════════════════════
//  MAIN APP
// ════════════════════════════════════════════════════════════
function App(){
  const[tab,setTab]=useState(0);
  const tabs=['Stack Exploit','Format Strings','Integer Bugs','Call Stack','Reference'];
  const content=[<StackExploitTab/>,<FormatStringsTab/>,<IntegerBugsTab/>,<CallStackTab/>,<SafeFunctionsTab/>];

  return <div style={{padding:'20px 24px',maxWidth:1280,margin:'0 auto'}}>
    <div style={{marginBottom:20}}>
      <h1 style={{fontFamily:'var(--font-display)',fontSize:22,fontWeight:700,color:C.acc,letterSpacing:'-0.02em',marginBottom:2}}>
        Memory Safety Lab
      </h1>
      <div style={{fontFamily:'var(--font-body)',fontSize:12,color:C.dim}}>
        ITIS 6200/8200 — Buffer overflows, format strings, integer vulnerabilities, x86 calling conventions
      </div>
    </div>
    <TabNav tabs={tabs} active={tab} onChange={setTab}/>
    <div style={{marginTop:14}}>{content[tab]}</div>
  </div>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
