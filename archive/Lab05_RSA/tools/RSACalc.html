<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 05 Tool: RSA Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            background: #fff3e0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #e65100;
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            background: #fbe9e7;
            border-radius: 4px;
            border: 1px solid #ffccbc;
        }

        input {
            padding: 5px;
            width: 80px;
        }

        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background: #e64a19;
        }

        .result {
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .row {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Toy RSA Calculator</h1>

        <!-- Part 1: Key Gen -->
        <div class="section">
            <h2>1. Key Generation</h2>
            <div class="row">
                <label>Prime p:</label> <input type="number" id="p" value="11">
                <label>Prime q:</label> <input type="number" id="q" value="13">
            </div>
            <button onclick="genKeys()">Generate Keys (n, phi, d, e)</button>
            <div id="keysOutput" class="result"></div>
        </div>

        <!-- Part 2: Crypto Operations -->
        <div class="section">
            <h2>2. Crypto Operations</h2>
            <div class="row">
                <label>Message/Cipher (m):</label> <input type="number" id="msg" value="9">
                <label>Exponent (e or d):</label> <input type="number" id="exp" placeholder="Key">
                <label>Modulus (n):</label> <input type="number" id="mod" placeholder="n">
            </div>
            <button onclick="encrypt()">Compute (m^exp mod n)</button>
            <div id="cryptoOutput" class="result" style="font-size: 1.2em; color: #d84315;"></div>
        </div>
    </div>

    <script>
        // GCD
        function gcd(a, b) {
            if (!b) return a;
            return gcd(b, a % b);
        }

        // Extended Euclidean for Modular Inverse
        function modInverse(e, phi) {
            let m0 = phi;
            let y = 0, x = 1;
            if (phi == 1) return 0;
            while (e > 1) {
                let q = Math.floor(e / phi);
                let t = phi;
                phi = e % phi, e = t;
                t = y;
                y = x - q * y;
                x = t;
            }
            if (x < 0) x += m0;
            return x;
        }

        // Power Mod
        function powerMod(base, exp, mod) {
            let res = 1;
            base = base % mod;
            while (exp > 0) {
                if (exp % 2 == 1) res = (res * base) % mod;
                base = (base * base) % mod;
                exp = Math.floor(exp / 2);
            }
            return res;
        }

        function genKeys() {
            const p = parseInt(document.getElementById('p').value);
            const q = parseInt(document.getElementById('q').value);

            const n = p * q;
            const phi = (p - 1) * (q - 1);

            // Find smallest odd e corresponding to phi
            let e = 3;
            while (gcd(e, phi) !== 1) {
                e += 2;
            }

            const d = modInverse(e, phi);

            document.getElementById('keysOutput').innerHTML = `
                n = ${n} <br>
                phi = ${phi} <br>
                <strong>Public Key (e, n): (${e}, ${n})</strong> <br>
                <strong>Private Key (d, n): (${d}, ${n})</strong>
            `;

            // Auto-fill
            document.getElementById('mod').value = n;
        }

        function encrypt() {
            const m = parseInt(document.getElementById('msg').value);
            const exp = parseInt(document.getElementById('exp').value);
            const mod = parseInt(document.getElementById('mod').value);

            const res = powerMod(m, exp, mod);
            document.getElementById('cryptoOutput').innerText = `Result: ${res}`;
        }
    </script>
</body>

</html>
