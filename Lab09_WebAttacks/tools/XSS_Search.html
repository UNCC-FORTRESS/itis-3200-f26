<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 09 Tool: Search Engine</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            padding: 50px;
            text-align: center;
            background: #fafafa;
        }

        input {
            padding: 10px;
            width: 400px;
            font-size: 1.2em;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            padding-left: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2em;
            border: none;
            background: #4285f4;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        #results {
            margin-top: 50px;
            text-align: left;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .result-item {
            margin-bottom: 20px;
        }

        .title {
            color: #1a0dab;
            font-size: 1.2em;
            text-decoration: none;
        }

        .url {
            color: #006621;
            font-size: 0.9em;
        }

        .desc {
            color: #545454;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <h1>Insecure Search</h1>
    <div>
        <input type="text" id="query" placeholder="Search...">
        <button onclick="search()">Search</button>
    </div>

    <!-- The Vulnerability: We will reflect the input directly into innerHTML -->
    <div id="status" style="margin-top:20px; font-size:1.2em;"></div>

    <div id="results"></div>

    <script>
        // Simulate URL params
        const urlParams = new URLSearchParams(window.location.search);
        const q = urlParams.get('q');

        if (q) {
            document.getElementById('query').value = q;
            triggerSearch(q);
        }

        function search() {
            const val = document.getElementById('query').value;
            triggerSearch(val);
        }

        function triggerSearch(val) {
            const status = document.getElementById('status');
            const results = document.getElementById('results');

            // VULNERABLE LINE:
            status.innerHTML = "Results for: " + val;

            // Dummy results
            results.innerHTML = `
                <div class="result-item">
                    <div class="title">Result 1</div>
                    <div class="url">www.example.com</div>
                    <div class="desc">This is a search result relevant to ${val.replace(/</g, "&lt;")}...</div> 
                </div>
            `;
        }
    </script>
</body>

</html>
