<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encryption Visualization</title>
    <style>
        :root {
            --alice-bg: #e3f2fd;
            --alice-border: #90caf9;
            --channel-bg: #fff3e0;
            --channel-border: #ffcc80;
            --bob-bg: #e8f5e9;
            --bob-border: #a5d6a7;
            --text-color: #333;
            --mono-font: 'Consolas', 'Monaco', monospace;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        h1 {
            text-align: center;
            margin: 0 0 15px 0;
            font-size: 1.6rem;
            color: #444;
            flex-shrink: 0;
        }

        /* MAIN LAYOUT */
        .pipeline-container {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: center;
            gap: 15px;
            flex: 1; /* Take remaining height */
            width: 100%;
            max-width: 1800px; /* Allow wide screens */
            margin: 0 auto;
            min-height: 0; /* Important for flex child scrolling */
        }

        /* STAGES */
        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            min-width: 300px;
            overflow: hidden; /* Internal scrolling handles content */
            background-color: #f9f9f9; 
        }

        .stage.alice { background-color: var(--alice-bg); border-color: var(--alice-border); }
        .stage.channel { background-color: var(--channel-bg); border-color: var(--channel-border); }
        .stage.bob { background-color: var(--bob-bg); border-color: var(--bob-border); }

        .stage h2 {
            margin-top: 0;
            font-size: 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 8px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            flex-shrink: 0;
        }

        /* ACTIONS */
        .action-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 80px;
            flex-shrink: 0;
        }

        .btn-action {
            padding: 12px 15px;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
            background-color: #1976d2;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-action:hover { background-color: #1565c0; }

        /* INPUTS & CONTROLS */
        .control-group { 
            margin-bottom: 12px; 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0; /* Prevent label crushing */
        }

        .scrollable-group {
            flex: 1; /* These sections grow to fill space */
            display: flex;
            flex-direction: column;
            min-height: 100px; 
            margin-bottom: 10px;
            overflow: hidden;
        }
        
        label { 
            display: block; 
            font-weight: 600; 
            font-size: 0.8rem; 
            margin-bottom: 4px; 
            color: #455a64;
        }

        /* Inputs / Textareas */
        input[type="text"], select, textarea {
            width: 100%;
            padding: 8px;
            font-family: var(--mono-font);
            font-size: 0.85rem;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 40px;
            max-height: 150px; /* Prevent massive growth */
        }

        input[readonly], textarea[readonly] { background-color: rgba(255,255,255,0.5); color: #444; }

        /* BITS AREA - SCROLLABLE */
        .bits-panel {
            font-family: var(--mono-font);
            font-size: 12px;
            background: #263238;
            color: #eceff1;
            padding: 10px;
            border-radius: 4px;
            line-height: 1.4;
            word-break: break-all;
            
            /* SCROLLING MAGIC */
            flex: 1; /* Grow to fill container */
            overflow-y: auto; /* Scroll when needed */
            min-height: 60px;
            max-height: 400px; /* Cap it reasonably */
            border: 1px solid #1c262b;
        }

        .stage-scroller {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px; /* Space for scrollbar */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: #cfd8dc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b0bec5; }

        .bit {
            display: inline-block;
            width: 8px;
            text-align: center;
            cursor: default;
        }
        .bit.one { color: #a5d6a7; }
        .bit.zero { color: #90a4ae; }

        .interactive .bit { cursor: pointer; }
        .interactive .bit:hover { font-weight: bold; background-color: rgba(255,255,255,0.2); color:white; }
        .interactive .bit.flipped { color: #ff5252; font-weight: 900; }

        .highlight-label { color: #d32f2f; }

        .status-msg {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: none;
            flex-shrink: 0;
        }
        .status-success { background: #c8e6c9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .status-fail { background: #ffcdd2; color: #c62828; border: 1px solid #ef9a9a; }
        .status-warn { background: #fff9c4; color: #fbc02d; border: 1px solid #fff176; }

    </style>
</head>
<body>

<h1>Lab 1: Encryption Visualization</h1>

<div class="pipeline-container">
    
    <!-- STAGE 1: ALICE -->
    <div class="stage alice">
        <h2>Alice (Sender)</h2>
        <div class="stage-scroller">
            
            <div class="control-group">
                <label>Mode</label>
                <select id="selMode">
                    <option value="CBC">AES-CBC</option>
                    <option value="CTR">AES-CTR</option>
                    <option value="ECB">AES-ECB (Simulated)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Key</label>
                <input type="text" id="inpKey" value="SecretKey1234567">
            </div>

            <div class="control-group">
                <label>Message (M)</label>
                <!-- Changed to Textarea for resizing -->
                <textarea id="inpMsg" rows="3">The answer to life, the universe, and everything is 42</textarea>
            </div>

            <div class="scrollable-group">
                <label>Plaintext Bits</label>
                <div id="dispAliceBits" class="bits-panel"></div>
            </div>

        </div>
    </div>

    <!-- ACTION -->
    <div class="action-column">
        <button id="btnEncrypt" class="btn-action">Encrypt &rarr;</button>
    </div>

    <!-- STAGE 2: CHANNEL -->
    <div class="stage channel">
        <h2>Insecure Channel</h2>
        <div class="stage-scroller">

            <div class="scrollable-group">
                <div style="display:flex; justify-content:space-between;">
                    <label id="lblCipherBits">Ciphertext (C)</label>
                    <small id="statEdits" style="color:#d32f2f; font-weight:bold;"></small>
                </div>
                <div id="dispChannelBits" class="bits-panel interactive"></div>
                <div style="text-align:right; margin-top:2px;">
                    <button id="btnReset" style="font-size:0.7rem; cursor:pointer;">Reset</button>
                </div>
            </div>

            <div class="control-group">
                <label id="lblCipherHex">Hex Representation</label>
                <textarea id="inpCipherHex" readonly rows="3"></textarea>
            </div>
            
            <p style="font-size:0.8rem; color:#666; font-style:italic; margin:0;">
                Click individual bits above to corrupt the data.
            </p>

        </div>
    </div>

    <!-- ACTION -->
    <div class="action-column">
        <button id="btnDecrypt" class="btn-action">Decrypt &rarr;</button>
    </div>

    <!-- STAGE 3: BOB -->
    <div class="stage bob">
        <h2>Bob (Receiver)</h2>
        <div class="stage-scroller">

            <div class="control-group">
                <label id="lblBobMsg">Decrypted Message (M)</label>
                <textarea id="inpBobMsg" readonly rows="3" placeholder="..."></textarea>
            </div>

            <div class="scrollable-group">
                <label>Decrypted Bits</label>
                <div id="dispBobBits" class="bits-panel"></div>
            </div>

            <div id="boxStatus" class="status-msg"></div>

        </div>
    </div>

</div>

<script>
    // --- GLOBALS ---
    let iv = new Uint8Array(16); // Fixed Zero IV for lab demo simplicity
    let rawCipher = null;
    let modCipher = null;
    let isEncrypted = false;
    
    // --- UI REFS ---
    const selMode = document.getElementById('selMode');
    const inpKey = document.getElementById('inpKey');
    const inpMsg = document.getElementById('inpMsg');
    const dispAliceBits = document.getElementById('dispAliceBits');

    const dispChannelBits = document.getElementById('dispChannelBits');
    const inpCipherHex = document.getElementById('inpCipherHex');
    const lblCipherBits = document.getElementById('lblCipherBits');
    const lblCipherHex = document.getElementById('lblCipherHex');
    const statEdits = document.getElementById('statEdits');

    const inpBobMsg = document.getElementById('inpBobMsg');
    const dispBobBits = document.getElementById('dispBobBits');
    const lblBobMsg = document.getElementById('lblBobMsg');
    const boxStatus = document.getElementById('boxStatus');

    // --- INIT ---
    const enc = new TextEncoder();
    const dec = new TextDecoder();

    renderBits(dispAliceBits, enc.encode(inpMsg.value));

    inpMsg.addEventListener('input', () => {
        renderBits(dispAliceBits, enc.encode(inpMsg.value));
    });


    // --- FUNCTIONS ---

    async function getKey(str) {
        const hash = await crypto.subtle.digest('SHA-256', enc.encode(str));
        return await crypto.subtle.importKey('raw', hash, {name: 'AES-CBC'}, false, ['encrypt', 'decrypt']);
    }

    function renderBits(container, bytes, isInteractive=false, originalBytes=null) {
        container.innerHTML = '';
        if(!bytes) return 0;
        let diffs = 0;

        for(let i=0; i<bytes.length; i++) {
            const bVal = bytes[i];
            const oVal = originalBytes ? originalBytes[i] : bVal;
            
            for(let bit=7; bit>=0; bit--) {
                const bBit = (bVal >> bit) & 1;
                const oBit = (oVal >> bit) & 1;
                const changed = (bBit !== oBit);
                
                if(changed) diffs++;
                
                const span = document.createElement('span');
                span.className = 'bit ' + (bBit ? 'one' : 'zero');
                if(changed) span.classList.add('flipped');
                
                if(isInteractive) {
                    span.onclick = () => {
                        bytes[i] ^= (1 << bit);
                        updateChannelUI();
                        // Clear Bob
                        inpBobMsg.value = "";
                        lblBobMsg.innerText = "Decrypted Message (M?)";
                        lblBobMsg.classList.remove('highlight-label');
                        boxStatus.style.display = 'none';
                    }
                }
                
                span.innerText = bBit;
                container.appendChild(span);
            }
            container.appendChild(document.createTextNode(' '));
        }
        return diffs;
    }

    function updateChannelUI() {
        if(!modCipher) return;
        const diffs = renderBits(dispChannelBits, modCipher, true, rawCipher);
        
        // Hex Update
        inpCipherHex.value = Array.from(modCipher).map(b => b.toString(16).padStart(2,'0')).join(' ');

        // Labels
        if(diffs > 0) {
            statEdits.innerText = `Modified (${diffs} bits)`;
            lblCipherBits.innerText = "Ciphertext (C')";
            lblCipherBits.classList.add('highlight-label');
            lblCipherHex.innerText = "Hex Representation (C')";
        } else {
            statEdits.innerText = "";
            lblCipherBits.innerText = "Ciphertext (C)";
            lblCipherBits.classList.remove('highlight-label');
            lblCipherHex.innerText = "Hex Representation (C)";
        }
    }

    // --- BUTTONS ---

    document.getElementById('btnEncrypt').addEventListener('click', async () => {
        try {
            const key = await getKey(inpKey.value);
            const data = enc.encode(inpMsg.value);
            const mode = selMode.value;
            
            let buf;
            if(mode === 'CTR') {
                buf = await crypto.subtle.encrypt({name:'AES-CTR', counter: iv, length: 64}, key, data);
            } else {
                // CBC or ECB-simulated
                buf = await crypto.subtle.encrypt({name:'AES-CBC', iv: iv}, key, data);
            }
            
            rawCipher = new Uint8Array(buf);
            modCipher = new Uint8Array(rawCipher);
            isEncrypted = true;
            
            updateChannelUI();
            
            // Clean Bob
            inpBobMsg.value = "(Ready to Decrypt)";
            dispBobBits.innerHTML = "";
            boxStatus.style.display = 'none';
            lblBobMsg.innerText = "Decrypted Message (M)";
            lblBobMsg.classList.remove('highlight-label');

        } catch(e) {
            alert("Encryption Error: " + e.message);
        }
    });

    document.getElementById('btnDecrypt').addEventListener('click', async () => {
        if(!isEncrypted) return;
        
        try {
            const key = await getKey(inpKey.value);
            const mode = selMode.value;
            let buf;

            try {
                 if(mode === 'CTR') {
                    buf = await crypto.subtle.decrypt({name:'AES-CTR', counter: iv, length: 64}, key, modCipher);
                } else {
                    buf = await crypto.subtle.decrypt({name:'AES-CBC', iv: iv}, key, modCipher);
                }
                
                // Success
                const decBytes = new Uint8Array(buf);
                renderBits(dispBobBits, decBytes);
                
                // Decode string (safe)
                let text = "";
                for(let i=0; i<decBytes.length; i++){
                    let c = decBytes[i];
                    text += (c>=32 && c<=126) ? String.fromCharCode(c) : "?";
                }
                inpBobMsg.value = text;
                
                // Check Equality
                if(text === inpMsg.value) {
                    boxStatus.className = 'status-msg status-success';
                    boxStatus.innerText = "Integrity Verified: Match.";
                    lblBobMsg.innerText = "Decrypted Message (M)";
                    lblBobMsg.classList.remove('highlight-label');
                } else {
                    boxStatus.className = 'status-msg status-fail';
                    boxStatus.innerText = "Avalanche Observed: Output differs.";
                    lblBobMsg.innerText = "Decrypted Message (M')";
                    lblBobMsg.classList.add('highlight-label');
                }
                boxStatus.style.display = 'block';

            } catch(decErr) {
                // Padding Error
                inpBobMsg.value = "[PADDING ERROR - GARBAGE DATA]";
                dispBobBits.innerHTML = "<span style='color:red; font-style:italic;'>ERROR: PKCS#7 Padding Destroyed. The avalanche effect was so significant it corrupted the structural integrity of the block.</span>";
                lblBobMsg.innerText = "Decrypted Message (M')";
                lblBobMsg.classList.add('highlight-label');
                
                boxStatus.className = 'status-msg status-warn';
                boxStatus.innerHTML = "<b>Decryption Failed (Padding)</b><br>The ciphertext is so scrambled that it no longer has valid padding.";
                boxStatus.style.display = 'block';
            }

        } catch(e) {
            alert("Error: " + e.message);
        }
    });

    document.getElementById('btnReset').addEventListener('click', () => {
        if(rawCipher) {
            modCipher = new Uint8Array(rawCipher);
            updateChannelUI();
        }
    });

</script>

</body>
</html>
